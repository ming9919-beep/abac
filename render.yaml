# Render.com blueprint — Node web service for the ABA wallet demo.
#
# The live service created via the Render API is:
#   name: abac-wallet   url: https://abac-wallet.onrender.com
# (https://aba001.onrender.com is retired and returns x-render-routing: no-server;
#  do not test that old hostname.)
# Opening New → Blueprint on this repo would create an equivalent service.
#
# Why a Node service rather than a static site: we get a real process — the tiny
# http server in start-prod.cjs gives SPA fallback (/accounts, /transfer/send …),
# a /api/health endpoint, and a proxy to the optional wallet API backend.
# Build uses BASE_PATH=/ (root domain), unlike the /ABA001/ build used for GitHub Pages.
#
# Memory note (free 512Mi):
# - Frontend static server is the primary process and must stay up.
# - Backend (pglite WASM) runs under a supervisor loop; if it is OOM-killed the
#   frontend keeps serving. Set BACKEND_ENABLED=false in the dashboard to skip the
#   backend entirely; the frontend has a full offline (localStorage) fallback.
# - WALLET_ID_PEPPER / WALLET_ENCRYPTION_KEY are auto-generated at boot when unset
#   (data lives in /tmp and resets on free-tier restarts).

services:
  - type: web
    name: abac-wallet
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && PORT=5173 BASE_PATH=/ pnpm build && pnpm --filter @workspace/api-server build
    startCommand: bash start-render.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: BASE_PATH
        value: /
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: pglite:
      - key: PAYWAY_MODE
        value: mock
      - key: BAKONG_MODE
        value: mock
      # Backend wallet API on/off. Set "false" if the free instance shows OOM events.
      - key: BACKEND_ENABLED
        value: "true"
